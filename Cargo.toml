[package]
name = "dmsmid"
version = "0.1.0"
edition = "2021"
description = "Convert Domino .dms projects to Standard MIDI Files and back"

[dependencies]
anyhow = "1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
memmap2 = "0.9.11"
rfd = "0.15"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
